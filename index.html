<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promo Hero</title>
  <script>try{if(localStorage.getItem("promo-hero-theme")==="plain")document.documentElement.dataset.theme="plain";}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bungee&display=swap" rel="stylesheet">
</head>
<body>
  <div class="awning" aria-hidden="true"></div>
  <div class="banner" role="note">
    <strong>Not legal advice.</strong> Promo Hero is an issue-spotting and drafting aid. Promotion law is state-specific and changes often. Have a licensed attorney review anything before you launch.
  </div>
  <header class="top">
    <div class="brand">Promo Hero <span>sweepstakes, contests, and giveaways</span></div>
    <div class="top-actions">
      <button type="button" class="btn ghost" id="theme" aria-pressed="true"></button>
      <button type="button" class="btn ghost" id="reset">Start over</button>
    </div>
  </header>
  <div class="layout">
    <nav class="steps" id="steps" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
    <aside class="flags" id="flags" aria-label="Legal flags"></aside>
  </div>
  <script src="js/questions.js"></script>
  <script src="js/flags.js"></script>
  <script src="js/clauses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
